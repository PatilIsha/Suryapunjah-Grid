<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="Suryapunjah Grid Energy mark">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC846"/><stop offset="55%" stop-color="#F5A623"/><stop offset="100%" stop-color="#E8801B"/>
    </linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3D75"/><stop offset="100%" stop-color="#0E1F3D"/>
    </linearGradient>
    <linearGradient id="gPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E4E8C"/><stop offset="100%" stop-color="#14274B"/>
    </linearGradient>
    <linearGradient id="gLeaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4E9B2E"/><stop offset="100%" stop-color="#9ACD3B"/>
    </linearGradient>
  </defs>

  <!-- sun -->
  <g stroke="url(#gGold)" stroke-width="3.4" stroke-linecap="round">
    <line x1="70" y1="6"  x2="70" y2="20"/>
    <line x1="52" y1="11" x2="57" y2="24"/>
    <line x1="88" y1="11" x2="83" y2="24"/>
    <line x1="37" y1="22" x2="47" y2="32"/>
    <line x1="103" y1="22" x2="93" y2="32"/>
    <line x1="28" y1="38" x2="41" y2="43"/>
    <line x1="112" y1="38" x2="99" y2="43"/>
  </g>
  <circle cx="70" cy="47" r="17" fill="url(#gGold)"/>

  <!-- S: navy base + gold ribbon -->
  <path d="M104 46 C104 22, 62 16, 47 36 C32 57, 62 70, 80 80 C104 93, 102 120, 72 124 C48 127, 33 114, 33 101" fill="none" stroke-linecap="round" stroke="url(#gNavy)" stroke-width="21"/>
  <path d="M104 46 C104 22, 62 16, 47 36 C32 57, 62 70, 80 80 C104 93, 102 120, 72 124 C48 127, 33 114, 33 101" fill="none" stroke-linecap="round" stroke="url(#gGold)" stroke-width="21" pathLength="100" stroke-dasharray="40 100" stroke-dashoffset="-18"/>

  <!-- solar panel -->
  <g transform="rotate(-24 68 56)">
    <rect x="34" y="42" width="70" height="30" rx="3" fill="url(#gPanel)"/>
    <g stroke="#8FB3E8" stroke-width="1.1" opacity=".85">
      <line x1="51" y1="42" x2="51" y2="72"/><line x1="69" y1="42" x2="69" y2="72"/><line x1="87" y1="42" x2="87" y2="72"/>
      <line x1="34" y1="52" x2="104" y2="52"/><line x1="34" y1="62" x2="104" y2="62"/>
    </g>
  </g>

  <!-- leaves -->
  <path d="M27 112 C27 96, 39 87, 53 86 C53 101, 43 113, 27 112 Z" fill="url(#gLeaf)"/>
  <path d="M22 122 C10 113, 10 98, 18 88 C29 97, 32 112, 22 122 Z" fill="url(#gLeaf)" opacity=".92"/>
</svg>
